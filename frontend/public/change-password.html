<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Change Password</h2>
    <form id="changeForm">
      <div class="input-box">
        <input type="password" id="newPassword" placeholder="New Password" required>
      </div>
      <button type="submit">Update Password</button>
    </form>
    <div class="links">
      <a href="dashboard.html">Back to Dashboard</a>
    </div>
    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById('changeForm');
    const message = document.getElementById('message');

    function validarPassword(password) {
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
      return regex.test(password);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const token = localStorage.getItem("token");

      if (!validarPassword(newPassword)) {
        message.style.color = "red";
        message.textContent = "❌ Contraseña insegura (mín. 8, mayúscula, minúscula, número, símbolo)";
        return;
      }

      try {
        const response = await fetch('http://localhost:4000/api/auth/change-password', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ password: newPassword })
        });
        const data = await response.json();
        if (response.ok) {
          message.style.color = "lime";
          message.textContent = "✅ Contraseña actualizada";
        } else {
          message.style.color = "red";
          message.textContent = "❌ " + (data.msg || "Error al cambiar contraseña");
        }
      } catch {
        message.style.color = "red";
        message.textContent = "⚠️ Error de conexión con el servidor";
      }
    });
  </script>
</body>
</html>
