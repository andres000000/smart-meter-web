<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Optimizador de Energía</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos adicionales para el selector de roles */
    .role-container {
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    .role-label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .role-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .role-option {
      display: flex;
      align-items: center;
    }

    .role-option input[type="radio"] {
      margin-right: 8px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .role-option label {
      margin: 0;
      cursor: pointer;
      flex: 1;
      padding: 10px;
      background: white;
      border-radius: 5px;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .role-option input[type="radio"]:checked + label {
      background: #e3f2fd;
      border-color: #2196f3;
      font-weight: bold;
      color: #2196f3;
    }

    .role-description {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .input-box {
      margin-bottom: 15px;
    }

    .input-box input,
    .input-box select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Crear Cuenta</h2>
    <p style="text-align: center; color: #666; margin-bottom: 20px;">
      ⚡ Optimizador Inteligente de Energía en el Hogar
    </p>

    <form id="signupForm">
      <div class="input-box">
        <input type="text" id="nombre" placeholder="Nombre completo" required>
      </div>

      <div class="input-box">
        <input type="email" id="correo" placeholder="Email (ej: usuario@dominio.com)" required>
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Contraseña" required>
        <small style="color: #999; display: block; margin-top: 5px;">
          🔒 Min. 8 caracteres, 1 mayúscula, 1 número y 1 símbolo (!@#$%^&*)
        </small>
      </div>

      <!-- SELECTOR DE ROL -->
      <div class="role-container">
        <span class="role-label">Tipo de Cuenta:</span>
        <div class="role-options">
          <div class="role-option">
            <input type="radio" id="rolUsuario" name="rol" value="usuario" checked required>
            <label for="rolUsuario">
              👤 Usuario
              <div class="role-description">Acceso al dashboard personal</div>
            </label>
          </div>

          <div class="role-option">
            <input type="radio" id="rolAdmin" name="rol" value="administrador" required>
            <label for="rolAdmin">
              🔧 Administrador
              <div class="role-description">Control total del sistema</div>
            </label>
          </div>
        </div>
      </div>

      <button type="submit">Registrarse</button>
    </form>

    <div class="links">
      <a href="index.html">← Volver al Login</a>
    </div>

    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');

    function validarCorreo(correo) {
      const regex = /^[^@]+@[^@]+\.[a-zA-Z]{2,}$/;
      return regex.test(correo);
    }

    function validarPassword(password) {
      const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
      return regex.test(password);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;
      const rol = document.querySelector('input[name="rol"]:checked').value;

      // Validaciones
      if (!nombre) {
        mostrarMensaje("❌ Por favor ingresa tu nombre", "error");
        return;
      }

      if (!validarCorreo(correo)) {
        mostrarMensaje("❌ Correo inválido", "error");
        return;
      }

      if (!validarPassword(password)) {
        mostrarMensaje("❌ Contraseña insegura (min. 8 caracteres, 1 mayúscula, 1 número, 1 símbolo)", "error");
        return;
      }

      try {
        const response = await fetch('http://localhost:4000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, correo, password, rol })
        });

        const data = await response.json();

        if (response.ok) {
          mostrarMensaje(`✅ Registro exitoso como ${rol}. Redirigiendo...`, "success");
          
          // Guardar token
          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
          }

          setTimeout(() => {
            // Redirigir según rol
            if (data.user.rol === 'administrador') {
              window.location.href = "dashboard-admin.html";
            } else {
              window.location.href = "dashboard.html";
            }
          }, 1500);
        } else {
          mostrarMensaje("❌ " + (data.msg || "Error en el registro"), "error");
        }
      } catch (err) {
        console.error("Error:", err);
        mostrarMensaje("⚠️ Error de conexión con el servidor", "error");
      }
    });

    function mostrarMensaje(texto, tipo) {
      message.textContent = texto;
      message.style.color = tipo === 'error' ? 'red' : 'lime';
      message.style.marginTop = '15px';
      message.style.padding = '10px';
      message.style.borderRadius = '4px';
      message.style.backgroundColor = tipo === 'error' ? '#fee' : '#efe';
      message.style.border = `1px solid ${tipo === 'error' ? '#fcc' : '#cfc'}`;
    }
  </script>
</body>
</html>
