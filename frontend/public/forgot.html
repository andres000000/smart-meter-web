<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <h2>Forgot Password</h2>
    <form id="forgotForm">
      <div class="input-box">
        <input type="email" id="correo" placeholder="Email (ej: usuario@dominio.com)" required>
      </div>
      <button type="submit">Send Reset Link</button>
    </form>
    <div class="links">
      <a href="index.html">Back to Login</a>
    </div>
    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const correo = document.getElementById('correo').value;

      try {
        const response = await fetch('http://localhost:4000/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo })
        });
        const data = await response.json();
        if (response.ok) {
          message.style.color = "lime";
          message.textContent = "📧 Enlace de recuperación enviado (simulado)";
        } else {
          message.style.color = "red";
          message.textContent = "❌ " + (data.msg || "Error al enviar enlace");
        }
      } catch {
        message.style.color = "red";
        message.textContent = "⚠️ Error de conexión con el servidor";
      }
    });
  </script>
</body>
</html>
